<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/style/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <title>Previsão do Tempo</title>
</head>
<body>
  <div id="container">
      <form id="search">
        <i class="fa-solid fa-location-dot"></i>
        <input
         type="search" 
         name="city_name"
         id="city_name" 
         placeholder="Buscar Cidade"
        >
        <button type="submit">
         <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </form>
      <div id="weather">
        <h1 id="title">Rio de Janeiro, RJ</h1>

        <div id="infos">
             <div id="temp">
                <img id="temp_img" src="https://openweathermap.org/img/wn/${json.tempIcon}@2x.png" alt="">

                <div>
                    <p id="temp_value">
                        21 <sup>°C</sup> 
                    </p>
                    <p id="temp_description">
                        Nublado
                    </p>
                </div>
             </div>
             <div id="other_infos">
                <div class="info">
                    <i id="temp_max_icon" class="fa-solid fa-temperature-low"></i>
                    <div>
                        <h2>Temp. Max.</h2>
                        <p id="temp_max"> 
                            22 <sup>°C</sup> 
                        </p>
                    </div>
                </div> 
                     <div class="info">
                    <i id="temp_min_icon" class="fa-solid fa-temperature-high"></i>
                        <div>
                          <h2>Temp. min.</h2>
                          <p id="temp_min"> 
                            19 <sup>°C</sup> 
                          </p>
                        </div>
                     </div>
                      <div class="info">
                    <i id="humidity_icon" class="fa-solid fa-droplet"></i>
                        <div>
                          <h2>Umidade</h2>
                          <p id="humidity"> 
                             86%
                          </p>
                        </div>
                     </div>
                      <div class="info">
                    <i id="wind_icon" class="fa-solid fa-wind"></i>
                        <div>
                          <h2>Vento</h2>
                          <p id="wind"> 
                            14 km/h
                          </p>
                        </div>
                     </div>
             </div>
      </div>
   </div>
   <div id="alert"></div>
</div>
<script src="src/javascript/script.js"></script>
</body>
</html>
